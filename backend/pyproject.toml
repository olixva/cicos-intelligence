[build-system]
requires = ["setuptools>=80.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "allianz-rag-backend"
version = "0.1.0"
description = "Local RAG backend for Allianz manual inspection"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.128.0",
    "pydantic>=2.12.0",
    "pypdf>=6.0.0",
    "PyYAML>=6.0.3",
    "sse-starlette>=2.1.0,<3.0.0",
    "uvicorn[standard]>=0.40.0",
]

[project.optional-dependencies]
ingestion = [
    "docling==2.124.0",
    "pypdfium2==5.13.0",
]
local-rag = [
    "fastembed==0.8.0",
    "langchain-community==0.4.1", # Ragas 0.4.3 imports the removed vertexai module.
    "langfuse==4.15.1",
    "langgraph==1.2.11",
    "openai==2.54.0",
    "qdrant-client==1.19.0",
    "ragas==0.4.3",
]

[project.scripts]
allianz = "infrastructure.adapters.inbound.cli.main:main"

[dependency-groups]
dev = [
    "httpx2>=0.1.0",
    "pytest>=9.0.0",
    "pyright>=1.1.400",
    "ruff>=0.15.0",
]
ingestion = [
    "docling==2.124.0",
    "pypdfium2==5.13.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["bootstrap"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["domain*", "application*", "infrastructure*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src", "tests"]
reportMissingTypeStubs = "none"
